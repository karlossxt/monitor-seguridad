name: Monitor de Seguridad IA

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar librerías
        run: pip install feedparser requests groq

      - name: Ejecutar monitor
        env:
          WEBHOOK_UNIFICADO: ${{ secrets.WEBHOOK_UNIFICADO }}          
          RSS_BUNDLE: ${{ secrets.RSS_BUNDLE }}          
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
